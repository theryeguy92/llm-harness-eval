[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Reusable framework for evaluating LLMs: A/B testing, RAG scoring, latency benchmarking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "typer==0.9.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
]

[project.scripts]
run-eval = "run_eval:app"

[tool.hatch.build.targets.wheel]
packages = ["evaluators", "runners"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
